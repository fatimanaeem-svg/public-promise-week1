<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
<title>{{ event_title }}</title>
<style>
  :root {
    --bg: #0b0d12;
    --card: #14171f;
    --text: #f5f6f8;
    --muted: #9aa3b2;
    --accent: #5b8cff;
    --accent-dark: #3d68d8;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    padding: env(safe-area-inset-top, 24px) 20px calc(env(safe-area-inset-bottom, 24px) + 24px) 20px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .wrap {
    width: 100%;
    max-width: 560px;
    margin-top: 24px;
  }
  h1.eyebrow {
    font-size: 14px;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: var(--muted);
    text-align: center;
    margin: 0 0 28px;
    font-weight: 600;
  }
  label {
    display: block;
    font-size: 15px;
    font-weight: 600;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .question {
    font-size: 22px;
    font-weight: 700;
    line-height: 1.35;
    margin: 4px 0 18px;
  }
  input[type="text"], textarea {
    width: 100%;
    background: var(--card);
    border: 1px solid #262b36;
    color: var(--text);
    border-radius: 14px;
    padding: 16px;
    font-size: 17px;
    font-family: inherit;
    line-height: 1.4;
    -webkit-appearance: none;
    appearance: none;
  }
  input[type="text"]:focus, textarea:focus {
    outline: none;
    border-color: var(--accent);
  }
  textarea {
    min-height: 220px;
    resize: vertical;
  }
  .field {
    margin-bottom: 26px;
  }
  button {
    width: 100%;
    padding: 18px;
    font-size: 19px;
    font-weight: 700;
    border-radius: 14px;
    border: none;
    background: var(--accent);
    color: white;
    -webkit-appearance: none;
    appearance: none;
  }
  button:active {
    background: var(--accent-dark);
  }
  button:disabled {
    background: #2a2f3a;
    color: var(--muted);
  }
  .hint {
    color: var(--muted);
    font-size: 13px;
    margin-top: 8px;
  }
  .error {
    color: var(--danger);
    font-size: 15px;
    margin-top: 14px;
    display: none;
  }
  #thankyou {
    display: none;
    text-align: center;
    margin-top: 60px;
  }
  #thankyou h2 {
    font-size: 32px;
    margin-bottom: 12px;
  }
  #thankyou p {
    color: var(--muted);
    font-size: 17px;
    line-height: 1.5;
  }
  .checkmark {
    font-size: 56px;
    margin-bottom: 8px;
  }
</style>
</head>
<body>
  <div class="wrap" id="formWrap">
    <h1 class="eyebrow">{{ event_title }}</h1>

    <form id="promiseForm">
      <div class="field">
        <label for="name">Your name or team name</label>
        <input type="text" id="name" name="name" autocomplete="name" required maxlength="80" placeholder="e.g. Jordan / Team Nimbus" />
      </div>

      <div class="field">
        <div class="question">{{ question_text }}<br><span style="font-weight:400;font-size:16px;color:var(--muted);">(Your answer will show on the screen)</span></div>
        <textarea id="answer" name="answer" required maxlength="4000" placeholder="Write a few sentences about the concrete goal you're committing to this week..."></textarea>
      </div>

      <button type="submit" id="submitBtn">Submit my promise</button>
      <div class="error" id="errorMsg"></div>
    </form>
  </div>

  <div id="thankyou">
    <div class="checkmark">&#10003;</div>
    <h2>Thank you!</h2>
    <p>Your promise is locked in and will appear on the big screen.<br>See you Week 2.</p>
  </div>

<script>
(function () {
  var STORAGE_KEY = 'ppw_submitted_v1';
  var form = document.getElementById('promiseForm');
  var formWrap = document.getElementById('formWrap');
  var thankyou = document.getElementById('thankyou');
  var submitBtn = document.getElementById('submitBtn');
  var errorMsg = document.getElementById('errorMsg');

  function showThankYou() {
    formWrap.style.display = 'none';
    thankyou.style.display = 'block';
  }

  if (localStorage.getItem(STORAGE_KEY) === '1') {
    showThankYou();
    return;
  }

  form.addEventListener('submit', function (e) {
    e.preventDefault();
    errorMsg.style.display = 'none';
    var name = document.getElementById('name').value.trim();
    var answer = document.getElementById('answer').value.trim();
    if (!name || !answer) return;

    submitBtn.disabled = true;
    submitBtn.textContent = 'Submitting...';

    fetch('/api/submit', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: name, answer: answer })
    })
      .then(function (res) { return res.json().then(function (body) { return { status: res.status, body: body }; }); })
      .then(function (result) {
        if (result.status === 200 && result.body.ok) {
          localStorage.setItem(STORAGE_KEY, '1');
          showThankYou();
        } else if (result.body && result.body.duplicate) {
          localStorage.setItem(STORAGE_KEY, '1');
          showThankYou();
        } else {
          errorMsg.textContent = (result.body && result.body.error) || 'Something went wrong. Please try again.';
          errorMsg.style.display = 'block';
          submitBtn.disabled = false;
          submitBtn.textContent = 'Submit my promise';
        }
      })
      .catch(function () {
        errorMsg.textContent = 'Network error — check your connection and try again.';
        errorMsg.style.display = 'block';
        submitBtn.disabled = false;
        submitBtn.textContent = 'Submit my promise';
      });
  });
})();
</script>
</body>
</html>
